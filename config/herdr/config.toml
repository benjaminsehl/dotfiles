# Herdr sits between Ghostty and interactive agent panes.
onboarding = false

[theme]
auto_switch = true
dark_name = "catppuccin"
light_name = "catppuccin-latte"

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[update]
channel = "stable"
version_check = true
manifest_check = true

[ui]
sidebar_width = 28
confirm_close = true
pane_borders = true
pane_gaps = true
show_agent_labels_on_pane_borders = true
accent = "#cba6f7"

[ui.toast]
delivery = "terminal"
delay_seconds = 2

[ui.sound]
enabled = false

[session]
resume_agents_on_restore = true

[experimental]
allow_nested = false
pane_history = false
